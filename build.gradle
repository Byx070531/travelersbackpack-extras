plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

version = "${minecraft_version}-${mod_version}"
group = mod_group_id

base {
	archivesName = mod_id
}

loom {
	accessWidenerPath = null
	runs {
		client {
			// Makes the client touch every client-side mixin target while starting, so a broken
			// selector fails loudly at launch instead of when the first backpack screen opens.
			vmArg "-Dtravelersbackpackextras.verifyMixins=true"
		}
		server {
			// Prints a PASS/FAIL report about multipliers, oversized stacks and recipes on boot.
			vmArg "-Dtravelersbackpackextras.selfTest=true"
		}
	}
}

repositories {
	maven { url "https://api.modrinth.com/maven" }
	maven {
		name = "TerraformersMC"
		url = "https://maven.terraformersmc.com/"
	}
	maven {
		name = 'Ladysnake Mods'
		url = 'https://maven.ladysnake.org/releases'
	}
	maven { url "https://maven.shedaniel.me/" }
	maven {
		name = 'ParchmentMC'
		url = 'https://maven.parchmentmc.org'
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// Traveler's Backpack - the mod we are an addon for
	modImplementation files("libs/travelersbackpack-fabric-1.21.11-10.11.11.jar")
	// Advanced Netherite - hard dependency, provides the netherite diamond block
	modImplementation files("libs/advancednetherite-fabric-2.4.0-1.21.11.jar")

	// Required at runtime by Traveler's Backpack
	modImplementation("maven.modrinth:forge-config-api-port:${project.forge_config_api_port_version}")
	api 'com.electronwill.night-config:core:3.8.1'
	api 'com.electronwill.night-config:toml:3.8.1'

	// Cloth Config (TB declares it as compile only, we mirror it)
	modCompileOnly("me.shedaniel.cloth:cloth-config-fabric:21.11.152")
}

processResources {
	var replaceProperties = [
			minecraft_version      : minecraft_version,
			minecraft_version_range: minecraft_version_range,
			mod_id                 : mod_id,
			mod_name               : mod_name,
			mod_display_name       : mod_display_name,
			mod_license            : mod_license,
			mod_version            : mod_version,
			mod_authors            : mod_authors,
			mod_description        : mod_description,
			mod_issue_tracker_url  : mod_issue_tracker_url,
	]
	inputs.properties replaceProperties

	filesMatching('fabric.mod.json') {
		expand replaceProperties
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = 'UTF-8'
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

dependencies {
	// Optional: only used for the in-game config screen, loaded only when Mod Menu is present.
	modCompileOnly "com.terraformersmc:modmenu:17.0.1"
}

